<div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal" style="max-width: 400px;">
        <div class="modal__header">
            <h3 class="modal__title" id="confirmTitle">Confirm action</h3>
            <button class="btn btn--icon" data-modal-close aria-label="Close">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        <div class="modal__body" data-confirm-message>Are you sure?</div>
        <div class="modal__actions">
            <button class="btn btn--ghost" data-modal-close>Cancel</button>
            <button class="btn btn--danger" data-confirm-accept>Confirm</button>
        </div>
    </div>
</div>
